  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:500 13px/1 'IBM Plex Sans Thai';color:var(--ink2)\">ชื่อ-นามสกุล<input type=\"text\" value=\"{{ draft.name }}\" sc-camel-on-change=\"{{ dName }}\" style=\"height:50px;border-radius:999px;border:1.5px solid var(--line);background:var(--input);color:var(--ink);font:500 16px/1 'IBM Plex Sans Thai';padding:0 18px;outline:none\" style-focus=\"border-color:var(--red)\"><\u002Flabel>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font:500 13px/1 'IBM Plex Sans Thai';color:var(--ink2)\">ประเภท\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--input);border-radius:999px;padding:4px\">\n          <button sc-camel-on-click=\"{{ dTypeFT }}\" style=\"height:42px;border-radius:999px;border:0;background:{{ ftBg }};color:{{ ftFg }};font:600 14px/1 'IBM Plex Sans Thai';cursor:pointer\">ประจำ (รายเดือน)<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ dTypePT }}\" style=\"height:42px;border-radius:999px;border:0;background:{{ ptBg }};color:{{ ptFg }};font:600 14px/1 'IBM Plex Sans Thai';cursor:pointer\">Part Time (รายชม.)<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font:500 13px/1 'IBM Plex Sans Thai';color:var(--ink2)\">ตำแหน่ง<input type=\"text\" list=\"col-positions\" value=\"{{ draft.pos }}\" sc-camel-on-change=\"{{ dPos }}\" placeholder=\"เลือกหรือพิมพ์ตำแหน่งใหม่\" style=\"height:50px;border-radius:999px;border:1.5px solid var(--line);background:var(--input);color:var(--ink);font:500 16px/1 'IBM Plex Sans Thai';padding:0 18px;outline:none\" style-focus=\"border-color:var(--red)\"><\u002Flabel>\n      <datalist id=\"col-positions\"><sc-for list=\"{{ positions }}\" as=\"p\"><option value=\"{{ p }}\"><\u002Foption><\u002Fsc-for><\u002Fdatalist>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font:500 13px/1 'IBM Plex Sans Thai';color:var(--ink2)\">{{ rateLabel }}<input type=\"text\" inputmode=\"decimal\" value=\"{{ draft.rate }}\" sc-camel-on-change=\"{{ dRate }}\" style=\"height:50px;border-radius:999px;border:1.5px solid var(--line);background:var(--input);color:var(--ink);font:600 16px/1 'IBM Plex Sans Thai';padding:0 18px;outline:none;font-variant-numeric:tabular-nums\" style-focus=\"border-color:var(--red)\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font:500 13px/1 'IBM Plex Sans Thai';color:var(--ink2)\">รหัสพนักงาน<input type=\"text\" value=\"{{ draft.code }}\" sc-camel-on-change=\"{{ dCode }}\" placeholder=\"ไม่บังคับ\" style=\"height:50px;border-radius:999px;border:1.5px solid var(--line);background:var(--input);color:var(--ink);font:500 16px/1 'IBM Plex Sans Thai';padding:0 18px;outline:none\" style-focus=\"border-color:var(--red)\"><\u002Flabel>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ dToggleCount }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-radius:18px;border:0;background:var(--input);padding:0 16px;color:var(--ink);cursor:pointer;text-align:left\">\n        <span style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 14.5px/1.2 'IBM Plex Sans Thai'\">นับเข้า COL<\u002Fspan><span style=\"font:400 12px/1.2 'IBM Plex Sans Thai';color:var(--ink3)\">HOST / Reception ปิดไว้<\u002Fspan><\u002Fspan>\n        <span style=\"width:50px;height:30px;border-radius:999px;background:{{ swBg }};position:relative;flex:none;transition:background-color .15s\"><span style=\"position:absolute;top:3px;left:{{ swX }}px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s cubic-bezier(.23,1,.32,1)\"><\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ editError }}\"><div style=\"font:500 13.5px/1.4 'IBM Plex Sans Thai';color:var(--red-ink)\">{{ editError }}<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex;gap:10px;margin-top:4px\">\n        <sc-if value=\"{{ canDelete }}\"><button sc-camel-on-click=\"{{ deleteEmp }}\" style=\"height:52px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--red-ink);font:600 15px/1 'IBM Plex Sans Thai';padding:0 20px;cursor:pointer\">ลบ<\u002Fbutton><\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ closeEdit }}\" style=\"height:52px;border-radius:999px;border:0;background:var(--surface2);color:var(--ink);font:600 15px/1 'IBM Plex Sans Thai';padding:0 20px;cursor:pointer\">ยกเลิก<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ saveEmp }}\" style=\"flex:1;height:52px;border-radius:999px;border:0;background:var(--red);color:#fff;font:600 15px/1 'IBM Plex Sans Thai';cursor:pointer\" style-active=\"transform:scale(.97)\">บันทึก<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\">\n  <div style=\"position:fixed;left:0;right:0;top:18px;z-index:30;display:flex;justify-content:center;pointer-events:none\"><div style=\"background:var(--hero);color:#fff;border-radius:999px;padding:12px 20px;font:500 14px/1.3 'IBM Plex Sans Thai';box-shadow:0 10px 30px rgba(0,0,0,.25);animation:colUp .22s cubic-bezier(.23,1,.32,1);max-width:90%\">{{ toast }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;entryLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;card&quot;,&quot;table&quot;],&quot;default&quot;:&quot;card&quot;,&quot;tsType&quot;:&quot;'card'|'table'&quot;,&quot;section&quot;:&quot;ตัวเลือกดีไซน์&quot;},&quot;colDisplay&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rail&quot;,&quot;gauge&quot;,&quot;number&quot;],&quot;default&quot;:&quot;rail&quot;,&quot;tsType&quot;:&quot;'rail'|'gauge'|'number'&quot;,&quot;section&quot;:&quot;ตัวเลือกดีไซน์&quot;},&quot;amView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cards&quot;,&quot;ranked&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;'cards'|'ranked'&quot;,&quot;section&quot;:&quot;ตัวเลือกดีไซน์&quot;},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}\">\nclass Component extends DCLogic {\n  BR = [\n    { code: 'FPR', name: 'ฟิวเจอร์พาร์ค รังสิต' }, { code: 'BU', name: 'ม.กรุงเทพ' }, { code: 'TU', name: 'ม.ธรรมศาสตร์' },\n    { code: 'ACP', name: 'อยุธยา ซิตี้ปาร์ค' }, { code: 'CAY', name: 'เซ็นทรัล อยุธยา' }, { code: 'MVR', name: 'มาร์เก็ตวิลเลจ รังสิต' },\n    { code: 'SMA', name: 'สายไหม อเวนิว' }, { code: 'YCR', name: 'ยิ่งเจริญ สแควร์' }, { code: 'ZR', name: 'เซียร์ รังสิต' }\n  ];\n  POS = ['RGM Lv5', 'ARGM Lv.4', 'Head Chef Lv.4', 'Management Trainee Lv.3', 'Chef Lv.3', 'Chef Lv.2', 'Chef Lv.1', 'Chef Lv.0', 'Service Lv.2', 'Service Lv.1', 'Service Lv.0', 'Cashier Lv2', 'Reception Lv2', 'Part Time'];\n  TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];\n\n  state = {\n    theme: 'light', auth: null, loginBranch: 'FPR', pinInput: '', loginError: '', busy: false,\n    period: this.currentPeriod(), viewBranch: null, tab: 'summary',\n    employees: [], entry: this.blankEntry(), openRow: null,\n    amData: null, amLoading: false, draft: null, editError: '', toast: '', saveState: '', savedAt: null\n  };\n\n  loadScript(src) {\n    return new Promise(res => { const s = document.createElement('script'); s.src = src + '?v=' + Date.now(); s.onload = res; s.onerror = res; document.head.appendChild(s); });\n  }\n  ready() {\n    if (!this._ready) this._ready = (async () => {\n      if (!window.COL_CONFIG) await this.loadScript('config.js');\n      if (!(window.COL_CONFIG || {}).apiUrl && !window.COL_DEMO) await this.loadScript('data/seed-demo.js');\n      this.forceUpdate();\n    })();\n    return this._ready;\n  }\n  componentDidMount() {\n    this.ready();\n    const t = localStorage.getItem('col_theme') || this.props.defaultTheme || 'light';\n    const lb = localStorage.getItem('col_last_branch') || 'FPR';\n    this.setState({ theme: t, loginBranch: lb });\n    try {\n      const a = JSON.parse(sessionStorage.getItem('col_auth') || 'null');\n      if (a) this.setState({ auth: a }, () => a.role === 'am' ? this.loadAM() : this.loadBranch(a.branch));\n    } catch (e) {}\n  }\n\n  currentPeriod() {\n    const d = new Date(); let y = d.getFullYear(), m = d.getMonth() + 1;\n    if (d.getDate() > 20) { m++; if (m > 12) { m = 1; y++; } }\n    return y + '-' + String(m).padStart(2, '0');\n  }\n  shiftPeriod(p, n) { let [y, m] = p.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + String(m).padStart(2, '0'); }\n  periodRange(p) { const [y, m] = p.split('-').map(Number); return { start: new Date(y, m - 2, 21), end: new Date(y, m - 1, 20) }; }\n  periodLabel(p) {\n    const { start, end } = this.periodRange(p);\n    return `21 ${this.TH_M[start.getMonth()]} – 20 ${this.TH_M[end.getMonth()]} ${(end.getFullYear() + 543) % 100}`;\n  }\n  periodDays(p) { const { start, end } = this.periodRange(p); return Math.round((end - start) / 864e5) + 1; }\n  elapsedDays(p) {\n    const { start, end } = this.periodRange(p); const t = new Date(); t.setHours(0, 0, 0, 0);\n    if (t < start) return 0; if (t > end) return this.periodDays(p);\n    return Math.round((t - start) / 864e5) + 1;\n  }\n\n  blankEntry() { return { sales: '', temp: '', tin: '', tout: '', rows: {}, status: 'draft', submittedAt: null, updatedAt: null }; }\n  num(v) { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; }\n  tier(x) {\n    if (!x) return 0;\n    const T = [[1e6, .20], [1.25e6, .17], [1.5e6, .17], [2e6, .16], [2.25e6, .15], [2.5e6, .144], [3e6, .138], [3.25e6, .1345], [3.5e6, .131], [3.75e6, .128], [4e6, .1255], [4.25e6, .1225], [4.5e6, .12], [4.75e6, .117], [5e6, .1145], [5.5e6, .1135], [6e6, .1125], [6.5e6, .1115], [7e6, .1105]];\n    for (const [lim, p] of T) if (x < lim) return p;\n    return .1095;\n  }\n  calc(emps, entry) {\n    const n = v => this.num(v); const rows = (entry && entry.rows) || {};\n    const ft = [], pt = [];\n    (emps || []).forEach(e => {\n      if (!e.countCol) return;\n      const r = rows[e.id] || {}; const rate = n(e.rate);\n      let base, o1, o15, o3;\n      if (e.type === 'PT') { base = rate * n(r.d); o1 = rate * n(r.o1); o15 = rate * 1.5 * n(r.o15); o3 = rate * 3 * n(r.o3); }\n      else { const daily = rate / 30, hr = rate / 30 / 8; base = daily * n(r.d); o1 = daily * n(r.o1); o15 = hr * 1.5 * n(r.o15); o3 = hr * 3 * n(r.o3); }\n      const sso = Math.min(17500, base) * 0.05;\n      const o = { e, r, rate, daily: e.type === 'PT' ? rate : rate / 30, base, o1, o15, o3, sso, total: base + o1 + o15 + o3 + sso };\n      (e.type === 'PT' ? pt : ft).push(o);\n    });\n    const sum = a => a.reduce((s, x) => s + x.total, 0);\n    const ftSum = sum(ft), ptSum = sum(pt);\n    const temp = n(entry && entry.temp), tin = n(entry && entry.tin), tout = n(entry && entry.tout);\n    const adj = temp + tin - tout; const col = ftSum + ptSum + adj;\n    const sales = n(entry && entry.sales); const exVat = sales / 1.07;\n    const tgtPct = this.tier(exVat); const colPct = exVat ? col / exVat : 0;\n    const tgtAmt = tgtPct * exVat; const diff = tgtAmt - col;\n    return { ft, pt, ftSum, ptSum, temp, tin, tout, adj, col, sales, exVat, tgtPct, colPct, tgtAmt, diff, pass: colPct <= tgtPct, hasSales: sales > 0 };\n  }\n  baht(v) { return '฿' + Math.round(v).toLocaleString('en-US'); }\n  pct(v) { return (v * 100).toFixed(2) + '%'; }\n  short(v) { const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : a >= 1e3 ? Math.round(v / 1e3) + 'K' : Math.round(v) + ''; }\n\n  async api(action, p) {\n    await this.ready();\n    const url = (window.COL_CONFIG || {}).apiUrl;\n    if (url) {\n      const r = await fetch(url, { method: 'POST', body: JSON.stringify(Object.assign({ action }, p)) });\n      const j = await r.json(); if (j.error) throw new Error(j.error); return j;\n    }\n    return this.demoApi(action, p);\n  }\n  demoApi(action, p) {\n    const D = window.COL_DEMO;\n    if (!D) throw new Error('ยังไม่ได้ตั้งค่า apiUrl ใน config.js');\n    const isAM = p.pin === D.pins.AM;\n    const okBranch = b => isAM || (D.pins[b] && D.pins[b] === p.pin);\n    const getEmp = b => JSON.parse(localStorage.getItem('col_emp_' + b) || 'null') || (D.employees[b] || []);\n    const getEntry = (b, per) => JSON.parse(localStorage.getItem('col_entry_' + b + '_' + per) || 'null');\n    if (action === 'login') {\n      if (p.branch === 'AM' ? isAM : (D.pins[p.branch] === p.pin)) return { ok: true, role: p.branch === 'AM' ? 'am' : 'branch' };\n      throw new Error('PIN ไม่ถูกต้อง');\n    }\n    if (action === 'load') { if (!okBranch(p.branch)) throw new Error('ไม่มีสิทธิ์'); return { employees: getEmp(p.branch), entry: getEntry(p.branch, p.period) }; }\n    if (action === 'save') {\n      if (!okBranch(p.branch)) throw new Error('ไม่มีสิทธิ์');\n      localStorage.setItem('col_emp_' + p.branch, JSON.stringify(p.employees));\n      localStorage.setItem('col_entry_' + p.branch + '_' + p.period, JSON.stringify(p.entry));\n      return { ok: true, savedAt: new Date().toISOString(), drive: false };\n    }\n    if (action === 'amAll') {\n      if (!isAM) throw new Error('ไม่มีสิทธิ์');\n      const out = {}; this.BR.forEach(b => out[b.code] = { employees: getEmp(b.code), entry: getEntry(b.code, p.period) });\n      return { branches: out };\n    }\n    throw new Error('unknown action');\n  }\n\n  flash(t) { this.setState({ toast: t }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 2600); }\n\n  async doLogin() {\n    const b = this.state.loginBranch, pin = this.state.pinInput.trim();\n    if (!pin) return this.setState({ loginError: 'กรุณากรอก PIN' });\n    this.setState({ busy: true, loginError: '' });\n    try {\n      const r = await this.api('login', { branch: b, pin });\n      const auth = { role: r.role, branch: b === 'AM' ? null : b, pin };\n      sessionStorage.setItem('col_auth', JSON.stringify(auth)); localStorage.setItem('col_last_branch', b);\n      this.setState({ auth, pinInput: '', busy: false }, () => r.role === 'am' ? this.loadAM() : this.loadBranch(b));\n    } catch (e) { this.setState({ busy: false, loginError: e.message || 'เข้าสู่ระบบไม่สำเร็จ' }); }\n  }\n  logout() { this.flushSave(); sessionStorage.removeItem('col_auth'); this.setState({ auth: null, viewBranch: null, amData: null, tab: 'summary' }); }\n\n  async loadBranch(b) {\n    try {\n      const r = await this.api('load', { branch: b, pin: this.state.auth.pin, period: this.state.period });\n      this.setState({ viewBranch: b, employees: r.employees || [], entry: Object.assign(this.blankEntry(), r.entry || {}), openRow: null, saveState: r.entry ? 'saved' : '', savedAt: r.entry && r.entry.updatedAt });\n    } catch (e) { this.flash(e.message); }\n  }\n  async loadAM() {\n    this.setState({ amLoading: true, viewBranch: null });\n    try { const r = await this.api('amAll', { pin: this.state.auth.pin, period: this.state.period }); this.setState({ amData: r.branches, amLoading: false }); }\n    catch (e) { this.setState({ amLoading: false }); this.flash(e.message); }\n  }\n  changePeriod(n) {\n    this.flushSave();\n    this.setState(s => ({ period: this.shiftPeriod(s.period, n) }), () => this.state.viewBranch ? this.loadBranch(this.state.viewBranch) : this.loadAM());\n  }\n\n  scheduleSave() { this.setState({ saveState: 'pending' }); clearTimeout(this._st); this._st = setTimeout(() => this.saveNow(false), 700); }\n  flushSave() { if (this._st && this.state.saveState === 'pending') { clearTimeout(this._st); this.saveNow(false
